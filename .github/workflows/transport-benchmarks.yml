name: Transport benchmarks

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/transport-benchmarks.yml'
      - 'appserver/transport/**'
      - 'appserver/protocol/**.go'
      - 'go.mod'

permissions:
  contents: read

concurrency:
  group: transport-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache: false
      - name: Record environment
        shell: bash
        run: |
          mkdir -p benchmark-results
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH GOAMD64
            echo "runner=${{ runner.os }}/${{ runner.arch }}"
          } | tee benchmark-results/environment.txt
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
      - name: Measure base pipeline on the same runner
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: benchmark-base
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee ../benchmark-results/base-commit.txt
          go test ./appserver/transport -run '^$' -bench 'BenchmarkInboundPipeline' -benchmem -benchtime=500ms -count=5 | tee ../benchmark-results/base-pipeline.txt
      - name: Collect baseline
        shell: bash
        run: |
          set -euo pipefail
          go test ./appserver/transport -run '^$' -bench 'BenchmarkInbound(Large|Pipeline|ReadLine|EnvelopeDecoder)' -benchmem -benchtime=500ms -count=5 -timeout=15m | tee benchmark-results/baseline.txt
      - name: Profile real notification pipeline
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/benchmark-results"
          go test ./appserver/transport -run '^$' -bench 'BenchmarkInboundPipeline/TurnDiff/9216KiB$' -benchtime=3s -cpuprofile="$output/cpu.pprof" -memprofile="$output/mem.pprof" -o "$output/transport.test" | tee benchmark-results/profile-run.txt
          go tool pprof -top "$output/transport.test" "$output/cpu.pprof" | tee benchmark-results/cpu-top.txt
          go tool pprof -top -alloc_space "$output/transport.test" "$output/mem.pprof" | tee benchmark-results/alloc-top.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-baseline-${{ matrix.os }}
          path: benchmark-results/
