name: CI

on:
  pull_request: {}
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Show Go version
        run: go version

      - name: Configure identity for local Git fixtures
        shell: bash
        run: |
          if ! git var GIT_AUTHOR_IDENT >/dev/null 2>&1 || ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
            git config --global user.name "$GITHUB_ACTOR"
            git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          fi

      - name: Download modules
        run: go mod download

      - name: Verify gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "Files need gofmt:"
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Verify module tidiness
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify 32-bit RPC error codes
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test -v ./appserver/protocol ./appserver/transport -run 'ErrorCode|RPCError|FuzzInboundRPCError' -count=1

      - name: Verify 32-bit collector byte counters
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test -v ./appserver -run '^TestCollector(Plan|Command)ByteCounter$' -count=1

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Show Go version
        run: go version

      - name: Configure identity for local Git fixtures
        shell: bash
        run: |
          if ! git var GIT_AUTHOR_IDENT >/dev/null 2>&1 || ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
            git config --global user.name "$GITHUB_ACTOR"
            git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          fi

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Verify 32-bit job objects
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test -v ./internal/process -count=1

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Show Go version
        run: go version

      - name: Configure identity for local Git fixtures
        shell: bash
        run: |
          if ! git var GIT_AUTHOR_IDENT >/dev/null 2>&1 || ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
            git config --global user.name "$GITHUB_ACTOR"
            git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          fi

      - name: Download modules
        run: go mod download

      - name: Test with race detector
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure identity for local Git fixtures
        shell: bash
        run: |
          if ! git var GIT_AUTHOR_IDENT >/dev/null 2>&1 || ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
            git config --global user.name "$GITHUB_ACTOR"
            git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --config=.golangci.yml ./...

      - name: Verify hook lint snapshots
        env:
          REQUIRE_PINNED_HOOK_LINT: '1'
        run: go test -v ./appserver/protocol -run '^TestPre(CommitRealLintScope|PushRealLint)$' -count=1
